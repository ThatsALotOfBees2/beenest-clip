[package]
name = "beenest-clip"
version = "0.1.0"
edition = "2021"
description = "Low-overhead instant-replay clip tool"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
global-hotkey = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
dirs = "7"
notify-rust = "4"
toml = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# The tray icon. Linux is left out: it would need GTK development packages
# to build; there the app runs in the background without an icon.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
